name: CI

# No secret is ever set here (D-2): every test path replays committed fixtures, and the
# `live` provider needs TRIAGE_LIVE=1 plus a key that CI does not have.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every gate step runs even after an earlier one fails, so one red run shows each check's verdict (D-39).
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run policy:lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run fixtures:check   # regenerates to a temp dir, compares sha256, runs the goldens; fails if fixtures/ moved
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run triage:eval      # exits non-zero if any per-ticket decision differs from fixtures/decisions_batch{1,2}.csv
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run triage:eval -- --provider recorded   # replays recordings/ (no key); exits non-zero on any difference from recordings/*/decisions.jsonl (D-49)
